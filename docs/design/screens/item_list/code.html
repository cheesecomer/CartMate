<script>
  const searchInput = document.getElementById('productSearch');
  const clearBtn = document.getElementById('clearSearch');
  const rows = document.querySelectorAll('.item-row');

  searchInput.addEventListener('input', (e) => {
    const val = e.target.value.trim().toLowerCase();
    if (val.length > 0) {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }

    rows.forEach(row => {
      const text = row.querySelector('.font-title-md').textContent.toLowerCase();
      const divider = row.nextElementSibling;
      if (text.includes(val)) {
        row.style.display = 'flex';
        if (divider && divider.classList.contains('h-[1px]')) {
          divider.style.display = 'block';
        }
      } else {
        row.style.display = 'none';
        if (divider && divider.classList.contains('h-[1px]')) {
          divider.style.display = 'none';
        }
      }
    });
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.add('hidden');
    rows.forEach(row => {
      row.style.display = 'flex';
      const divider = row.nextElementSibling;
      if (divider && divider.classList.contains('h-[1px]')) {
        divider.style.display = 'block';
      }
    });
  });

  const toggleBtn = document.getElementById('hiddenToggleBtn');
  const container = document.getElementById('hiddenItemsContainer');
  const arrow = document.getElementById('accordionArrow');

  toggleBtn.addEventListener('click', () => {
    const isHidden = container.classList.contains('hidden');
    if (isHidden) {
      container.classList.remove('hidden');
      arrow.textContent = 'keyboard_arrow_up';
    } else {
      container.classList.add('hidden');
      arrow.textContent = 'keyboard_arrow_down';
    }
  });
</script></main>
