<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="mobile_stack" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Epilogue:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#6B4E8C",
            "primary-container": "#F2E7FE",
            "on-primary": "#FFFFFF",
            "on-primary-container": "#260E43",
            "secondary": "#6E528D",
            "secondary-container": "#DBB9FD",
            "on-secondary-container": "#280B45",
            "surface": "#FFF7FF",
            "surface-dim": "#E1D6E7",
            "surface-bright": "#FFF7FF",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-low": "#FBF0FF",
            "surface-container": "#F6EAFB",
            "surface-container-high": "#E1D6E7",
            "surface-container-highest": "#EADFEF",
            "on-surface": "#1F1925",
            "on-surface-variant": "#4A454F",
            "outline": "#7C7580",
            "outline-variant": "#CCC3D0",
            "inverse-surface": "#342E3A",
            "inverse-on-surface": "#F9EDFE",
            "tertiary": "#264A3E",
            "tertiary-container": "#3E6255",
            "on-tertiary-container": "#B4DCCB"
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Epilogue", "sans-serif"]
          },
          borderRadius: {
            '28': '1.75rem',
            'm3-xl': '28px'
          }
        }
      }
    }
  </script>
<style>
    @layer base {
      html, body {
        width: 100vw;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-surface font-sans text-on-surface flex flex-col min-h-screen overflow-hidden relative">
<!-- ========================================== -->
<!-- BACKDROP SCREEN: List-Detail (半透明スクリム越しに透けて見える背面) -->
<!-- ========================================== -->
<div class="fixed inset-0 flex flex-col bg-surface z-0 pointer-events-none select-none">
<!-- List Detail Header -->
<header class="w-full bg-surface-container-low/90 pt-safe border-b border-outline-variant/30">
<div class="h-14 px-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<div>
<h1 class="font-bold text-[18px] text-on-surface leading-tight">週末の買い出し</h1>
<p class="text-[11px] text-on-surface-variant font-medium">オーケー 渋谷店 • 4/8点 完了</p>
</div>
</div>
<div class="flex items-center gap-1">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[22px]">share</span>
</div>
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs">
            CM
          </div>
</div>
</div>
</header>
<!-- List Detail Content Mock -->
<main class="flex-1 px-4 py-3 flex flex-col gap-2.5 overflow-hidden opacity-80">
<!-- Checked Items -->
<div class="flex items-center justify-between p-3.5 bg-surface-container-lowest/80 rounded-2xl border border-outline-variant/20 shadow-xs">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="text-[15px] line-through text-outline">にんじん (3本入)</span>
</div>
<span class="text-[12px] text-outline font-medium">1袋</span>
</div>
<div class="flex items-center justify-between p-3.5 bg-surface-container-lowest/80 rounded-2xl border border-outline-variant/20 shadow-xs">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="text-[15px] line-through text-outline">牛乳 (成分無調整)</span>
</div>
<span class="text-[12px] text-outline font-medium">2本</span>
</div>
<!-- Pending Items -->
<div class="flex items-center justify-between p-3.5 bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-xs">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full border-2 border-outline"></div>
<span class="text-[15px] text-on-surface font-medium">納豆 (小粒 3パック)</span>
</div>
<span class="text-[12px] text-on-surface-variant font-medium">1個</span>
</div>
<div class="flex items-center justify-between p-3.5 bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-xs">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full border-2 border-outline"></div>
<span class="text-[15px] text-on-surface font-medium">木綿豆腐</span>
</div>
<span class="text-[12px] text-on-surface-variant font-medium">1丁</span>
</div>
<div class="flex items-center justify-between p-3.5 bg-surface-container-lowest rounded-2xl border border-outline-variant/30 shadow-xs">
<div class="flex items-center gap-3">
<div class="w-6 h-6 rounded-full border-2 border-outline"></div>
<span class="text-[15px] text-on-surface font-medium">豚こま切れ肉 (300g)</span>
</div>
<span class="text-[12px] text-on-surface-variant font-medium">1パック</span>
</div>
</main>
</div>
<!-- ========================================== -->
<!-- MODAL SCRIM OVERLAY (rgba(0,0,0,0.5)) -->
<!-- ========================================== -->
<div class="fixed inset-0 bg-black/50 z-20 backdrop-blur-[1px] transition-opacity"></div>
<!-- ========================================== -->
<!-- BOTTOM SHEET MODAL (product-suggestions-sheet) -->
<!-- 上部角丸: 28dp (Material 3 Extra Large) -->
<!-- ========================================== -->
<section class="fixed inset-x-0 bottom-0 z-30 flex flex-col bg-surface-container-lowest rounded-t-[28px] shadow-[0_-8px_32px_rgba(38,14,67,0.22)] max-h-[92vh] overflow-hidden">
<!-- 1. Drag Handle Bar -->
<div class="w-full flex items-center justify-center pt-3 pb-1 cursor-grab">
<div class="w-10 h-1 rounded-full bg-outline-variant"></div>
</div>
<!-- 2. Search Input Row -->
<div class="px-4 pt-1 pb-2">
<div class="flex items-center bg-surface-container-high rounded-full px-3.5 h-12 border border-outline-variant/30 shadow-inner">
<span class="material-symbols-outlined text-[#6B4E8C] text-[22px] mr-2 shrink-0">search</span>
<div class="flex items-center flex-1 min-w-0">
<span class="text-[17px] text-on-surface font-semibold tracking-wide">たま</span>
<!-- Caret -->
<span class="w-[2px] h-5 bg-[#6B4E8C] ml-0.5 animate-pulse"></span>
</div>
<!-- Clear Button (×) -->
<button aria-label="入力をクリア" class="w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform shrink-0">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
<!-- 3. Fixed Top Action (最上部固定アクション: 固定文言「数量を設定して追加」) -->
<div class="px-4 py-1.5 border-b border-outline-variant/20 bg-surface-container-low/50">
<button class="w-full h-11 px-3.5 rounded-xl bg-primary-container/70 hover:bg-primary-container active:scale-[0.99] flex items-center justify-between text-on-primary-container transition-all">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#6B4E8C] text-[20px]">tune</span>
<span class="text-[14px] font-semibold text-[#6B4E8C]">数量を設定して追加</span>
</div>
<span class="material-symbols-outlined text-[#6B4E8C] text-[18px]">arrow_forward_ios</span>
</button>
</div>
<!-- 4. Unified Flat Suggestions List (統合された候補一覧: 装飾アイコンなし) -->
<div class="flex flex-col overflow-y-auto px-4 divide-y divide-outline-variant/15 max-h-52">
<!-- Item 1: 卵 -->
<div class="flex items-center justify-between py-1.5 active:bg-surface-container-low transition-colors rounded-lg px-1">
<!-- Tap text to open item details screen -->
<div class="flex-1 py-2 cursor-pointer pr-3">
<span class="text-[16px] text-on-surface font-medium block">卵</span>
</div>
<!-- Right Quick Add Button (Tap area 48dp, #6B4E8C) -->
<button aria-label="卵を即座に追加" class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-[#6B4E8C] hover:opacity-95 active:scale-90 transition-all shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
<!-- Item 2: たまご -->
<div class="flex items-center justify-between py-1.5 active:bg-surface-container-low transition-colors rounded-lg px-1">
<div class="flex-1 py-2 cursor-pointer pr-3">
<span class="text-[16px] text-on-surface font-medium block">たまご</span>
</div>
<button aria-label="たまごを即座に追加" class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-[#6B4E8C] hover:opacity-95 active:scale-90 transition-all shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
<!-- Item 3: 玉ねぎ -->
<div class="flex items-center justify-between py-1.5 active:bg-surface-container-low transition-colors rounded-lg px-1">
<div class="flex-1 py-2 cursor-pointer pr-3">
<span class="text-[16px] text-on-surface font-medium block">玉ねぎ</span>
</div>
<button aria-label="玉ねぎを即座に追加" class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-[#6B4E8C] hover:opacity-95 active:scale-90 transition-all shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
<!-- Item 4: たまごスープ -->
<div class="flex items-center justify-between py-1.5 active:bg-surface-container-low transition-colors rounded-lg px-1">
<div class="flex-1 py-2 cursor-pointer pr-3">
<span class="text-[16px] text-on-surface font-medium block">たまごスープ</span>
</div>
<button aria-label="たまごスープを即座に追加" class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-[#6B4E8C] hover:opacity-95 active:scale-90 transition-all shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
<!-- Item 5: たまごサンド -->
<div class="flex items-center justify-between py-1.5 active:bg-surface-container-low transition-colors rounded-lg px-1">
<div class="flex-1 py-2 cursor-pointer pr-3">
<span class="text-[16px] text-on-surface font-medium block">たまごサンド</span>
</div>
<button aria-label="たまごサンドを即座に追加" class="w-12 h-12 flex items-center justify-center rounded-full text-white bg-[#6B4E8C] hover:opacity-95 active:scale-90 transition-all shrink-0 shadow-sm">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
</div>
</div>
<!-- ========================================== -->
<!-- 5. JAPANESE KEYBOARD (12-Key Flick Keyboard) -->
<!-- 「Enter / 確定」キーは Primary #6B4E8C -->
<!-- ========================================== -->
<div class="flex flex-col bg-surface-container-high/60 w-full select-none pt-1 border-t border-outline-variant/30 pb-safe">
<!-- 予測変換候補バー -->
<div class="flex items-center overflow-x-auto px-2 py-1.5 gap-2 scrollbar-none bg-surface-container-low/90">
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          卵
        </button>
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          たまご
        </button>
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          玉ねぎ
        </button>
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          玉子
        </button>
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          タマゴ
        </button>
<button class="px-3 py-1 rounded-md bg-surface-container-lowest shadow-xs text-on-surface font-medium text-[14px] whitespace-nowrap active:bg-secondary-container">
          たま
        </button>
</div>
<!-- 12-Key Layout Grid -->
<div class="grid grid-cols-4 gap-1 p-1.5 max-w-md mx-auto w-full">
<!-- Row 1 -->
<button class="h-11 rounded-lg bg-surface-container-highest flex flex-col items-center justify-center active:bg-outline-variant/40 shadow-xs">
<span class="text-[12px] text-on-surface-variant font-bold">1/A/あ</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">あ</span>
<span class="text-[9px] text-outline leading-none">い う え お</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">か</span>
<span class="text-[9px] text-outline leading-none">き く け こ</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-highest flex items-center justify-center active:bg-outline-variant/40 shadow-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">backspace</span>
</button>
<!-- Row 2 -->
<button class="h-11 rounded-lg bg-surface-container-highest flex items-center justify-center active:bg-outline-variant/40 shadow-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_left</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">さ</span>
<span class="text-[9px] text-outline leading-none">し す せ そ</span>
</button>
<!-- た 行 (Active Input State) -->
<button class="h-11 rounded-lg bg-primary-container flex flex-col items-center justify-center active:bg-secondary-container shadow-xs">
<span class="text-[16px] text-on-primary-container font-bold leading-tight">た</span>
<span class="text-[9px] text-on-primary-container/80 font-medium leading-none">ち つ て と</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-highest flex items-center justify-center active:bg-outline-variant/40 shadow-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_right</span>
</button>
<!-- Row 3 -->
<button class="h-11 rounded-lg bg-surface-container-highest flex flex-col items-center justify-center active:bg-outline-variant/40 shadow-xs text-on-surface-variant">
<span class="text-[11px] font-bold">小/濁/半</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">な</span>
<span class="text-[9px] text-outline leading-none">に ぬ ね の</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">は</span>
<span class="text-[9px] text-outline leading-none">ひ ふ へ ほ</span>
</button>
<!-- Primary Enter/確定 Key (#6B4E8C) -->
<button aria-label="確定（数量1・単位個・直前公開範囲引き継ぎで即追加）" class="h-11 rounded-lg bg-[#6B4E8C] text-white flex flex-col items-center justify-center active:opacity-90 shadow-sm">
<span class="text-[13px] font-bold leading-none">確定</span>
<span class="material-symbols-outlined text-[16px] leading-none mt-0.5">keyboard_return</span>
</button>
<!-- Row 4 -->
<button class="h-11 rounded-lg bg-surface-container-highest flex items-center justify-center active:bg-outline-variant/40 shadow-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">sentiment_satisfied</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">ま</span>
<span class="text-[9px] text-outline leading-none">み む め も</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">や</span>
<span class="text-[9px] text-outline leading-none">（ ） 「 」</span>
</button>
<button class="h-11 rounded-lg bg-surface-container-lowest flex flex-col items-center justify-center active:bg-surface-container-highest shadow-xs">
<span class="text-[16px] text-on-surface font-semibold leading-tight">ら</span>
<span class="text-[9px] text-outline leading-none">り る れ ろ</span>
</button>
</div>
<!-- Keyboard Bottom Utility Bar -->
<div class="flex items-center justify-between px-3 py-1 text-on-surface-variant max-w-md mx-auto w-full">
<button class="w-10 h-8 flex items-center justify-center rounded hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">keyboard_hide</span>
</button>
<button class="flex-1 max-w-[140px] h-8 bg-surface-container-lowest rounded-md shadow-xs flex items-center justify-center text-[12px] text-outline active:bg-surface-container-highest">
          空白
        </button>
<button class="w-10 h-8 flex items-center justify-center rounded hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">mic</span>
</button>
</div>
</div>
</section>
</body></html>
