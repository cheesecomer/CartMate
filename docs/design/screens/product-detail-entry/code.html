<!-- Quick Unit Chips -->

<button class="unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all" data-unit="個" type="button">個</button>
<button class="unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all" data-unit="本" type="button">本</button>
<button class="unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all" data-unit="袋" type="button">袋</button>
<button class="unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all" data-unit="箱" type="button">箱</button>
<button class="unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all" data-unit="g" type="button">g</button>

<!-- 3. 公開範囲 (Visibility) -->
<div class="bg-surface-container-lowest rounded-2xl p-space-md border border-surface-container-highest/60 shadow-[0_2px_8px_rgba(107,78,140,0.04)]">

        同居家族や共有メンバーに見せるかどうかを選択します。
      </p>
<!-- Segmented Choice Cards -->
<div class="grid grid-cols-2 gap-2.5">
<!-- Shared (Default) -->
<label class="relative flex flex-col p-3 rounded-xl cursor-pointer border-2 border-primary bg-primary-container text-on-primary-container transition-all" id="visibility-shared-card">
<input checked="" class="sr-only" id="radio-shared" name="visibility" type="radio" value="shared"/>
<div class="flex items-center justify-between mb-1">

</div>

<!-- Private -->

<div class="flex items-center justify-between mb-1">
<div class="flex items-center gap-1.5">

</label>

<!-- 4. 備考 (OutlinedTextField) -->

<div class="flex items-center justify-between mb-1.5">

</div>

</div>
<!-- Memo Chips -->
<div class="flex flex-wrap items-center gap-1.5 mt-2.5">

<button class="memo-chip h-7 px-3 rounded-full bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-colors active:scale-95" data-text="賞味期限長め" type="button">賞味期限長め</button>
<button class="memo-chip h-7 px-3 rounded-full bg-surface-container text-on-surface-variant text-xs font-medium hover:bg-surface-container-high transition-colors active:scale-95" data-text="赤玉推奨" type="button">赤玉推奨</button>

</div>

<!-- Fixed Bottom Action CTA -->
<div class="fixed bottom-0 inset-x-0 z-40 bg-surface/90 backdrop-blur-xl px-space-md pt-2 pb-safe border-t border-surface-container-high/60 shadow-[0_-4px_16px_rgba(107,78,140,0.08)]">
<div class="max-w-md mx-auto py-1">
<button class="w-full h-12 min-h-[48px] rounded-full bg-primary text-on-primary font-bold text-[15px] flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.99] transition-all" id="submit-item-btn" type="button">
<span>リストに追加する</span>
<span class="material-symbols-outlined text-[20px]">check</span>
</button>

<script>
  (function() {
    // Quantity logic
    let qty = 1;
    const qtyVal = document.getElementById('qty-val');
    const btnMinus = document.getElementById('btn-qty-minus');
    const btnPlus = document.getElementById('btn-qty-plus');
    const qtyChips = document.querySelectorAll('.qty-chip');

    function updateQty(newVal) {
      qty = Math.max(1, newVal);
      qtyVal.textContent = qty;
      
      qtyChips.forEach(chip => {
        if (parseInt(chip.getAttribute('data-value'), 10) === qty) {
          chip.className = 'qty-chip flex-1 h-9 rounded-xl bg-primary text-on-primary font-semibold text-xs flex items-center justify-center active:scale-95 transition-all shadow-xs';
        } else {
          chip.className = 'qty-chip flex-1 h-9 rounded-xl bg-surface-container-low text-on-surface font-semibold text-xs flex items-center justify-center hover:bg-surface-container active:scale-95 transition-all';
        }
      });
    }

    btnMinus.addEventListener('click', () => updateQty(qty - 1));
    btnPlus.addEventListener('click', () => updateQty(qty + 1));
    qtyChips.forEach(chip => {
      chip.addEventListener('click', () => {
        updateQty(parseInt(chip.getAttribute('data-value'), 10));
      });
    });

    // Unit input & chips logic
    const unitInput = document.getElementById('unit-input-field');
    const unitIndicator = document.getElementById('unit-indicator');
    const unitChips = document.querySelectorAll('.unit-chip');
    const clearUnitBtn = document.getElementById('clear-unit-btn');

    unitInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      unitIndicator.textContent = val || '';
      highlightActiveUnitChip(val);
    });

    clearUnitBtn.addEventListener('click', () => {
      unitInput.value = '';
      unitIndicator.textContent = '';
      highlightActiveUnitChip('');
      unitInput.focus();
    });

    function highlightActiveUnitChip(selectedUnit) {
      unitChips.forEach(chip => {
        if (chip.getAttribute('data-unit') === selectedUnit) {
          chip.className = 'unit-chip h-8 px-3.5 rounded-full bg-primary text-on-primary text-xs font-semibold flex items-center justify-center transition-all shadow-xs';
        } else {
          chip.className = 'unit-chip h-8 px-3.5 rounded-full bg-surface-container-low text-on-surface text-xs font-medium border border-surface-container-highest flex items-center justify-center hover:bg-surface-container transition-all';
        }
      });
    }

    unitChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const u = chip.getAttribute('data-unit');
        unitInput.value = u;
        unitIndicator.textContent = u;
        highlightActiveUnitChip(u);
      });
    });

    // Memo suggestions
    const memoInput = document.getElementById('memo-input');
    const memoChips = document.querySelectorAll('.memo-chip');
    memoChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const text = chip.getAttribute('data-text');
        if (memoInput.value.length > 0) {
          memoInput.value += '、' + text;
        } else {
          memoInput.value = text;
        }
        memoInput.focus();
      });
    });

    // Visibility Selector
    const radioShared = document.getElementById('radio-shared');
    const radioPrivate = document.getElementById('radio-private');
    const cardShared = document.getElementById('visibility-shared-card');
    const cardPrivate = document.getElementById('visibility-private-card');
    const iconShared = document.getElementById('icon-shared-check');
    const iconPrivate = document.getElementById('icon-private-check');

    function syncVisibilityUI() {
      if (radioShared.checked) {
        cardShared.className = 'relative flex flex-col p-3 rounded-xl cursor-pointer border-2 border-primary bg-primary-container text-on-primary-container transition-all';
        cardPrivate.className = 'relative flex flex-col p-3 rounded-xl cursor-pointer border-2 border-transparent bg-surface-container-low text-on-surface-variant transition-all hover:bg-surface-container';
        iconShared.textContent = 'check_circle';
        iconShared.className = 'material-symbols-outlined text-[18px] text-primary';
        iconShared.style.fontVariationSettings = "'FILL' 1";
        iconPrivate.textContent = 'radio_button_unchecked';
        iconPrivate.className = 'material-symbols-outlined text-[18px] text-outline';
        iconPrivate.style.fontVariationSettings = "'FILL' 0";
      } else {
        cardPrivate.className = 'relative flex flex-col p-3 rounded-xl cursor-pointer border-2 border-primary bg-primary-container text-on-primary-container transition-all';
        cardShared.className = 'relative flex flex-col p-3 rounded-xl cursor-pointer border-2 border-transparent bg-surface-container-low text-on-surface-variant transition-all hover:bg-surface-container';
        iconPrivate.textContent = 'check_circle';
        iconPrivate.className = 'material-symbols-outlined text-[18px] text-primary';
        iconPrivate.style.fontVariationSettings = "'FILL' 1";
        iconShared.textContent = 'radio_button_unchecked';
        iconShared.className = 'material-symbols-outlined text-[18px] text-outline';
        iconShared.style.fontVariationSettings = "'FILL' 0";
      }
    }

    radioShared.addEventListener('change', syncVisibilityUI);
    radioPrivate.addEventListener('change', syncVisibilityUI);

    // Title editing inline
    const titleDisplay = document.getElementById('item-title-display');
    const editTitleBtn = document.getElementById('edit-title-btn');
    const inlineEditor = document.getElementById('inline-title-editor');
    const titleInput = document.getElementById('item-title-input');
    const saveTitleBtn = document.getElementById('save-title-btn');
    const cancelTitleBtn = document.getElementById('cancel-title-btn');

    editTitleBtn.addEventListener('click', () => {
      inlineEditor.classList.remove('hidden');
      titleInput.focus();
    });

    cancelTitleBtn.addEventListener('click', () => {
      inlineEditor.classList.add('hidden');
      titleInput.value = titleDisplay.textContent.trim();
    });

    saveTitleBtn.addEventListener('click', () => {
      if (titleInput.value.trim().length > 0) {
        titleDisplay.textContent = titleInput.value.trim();
      }
      inlineEditor.classList.add('hidden');
    });

    // Submit Action -> Return to list
    const submitBtn = document.getElementById('submit-item-btn');
    submitBtn.addEventListener('click', () => {
      submitBtn.classList.add('opacity-80', 'scale-[0.98]');
      setTimeout(() => {
        history.back();
      }, 150);
    });
  })();
</script></main></body></html>
