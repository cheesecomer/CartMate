<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Noto+Sans+JP:wght@400;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#FFF7FF;}body{overscroll-behavior-y:none;font-family:'Plus Jakarta Sans','Noto Sans JP',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        background: "#FFF7FF",
        surface: "#FFF7FF"
      }
    }
  }
};</script></head><body class="bg-[#FFF7FF] text-[#1D1B20] antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-[#F2E7FE]"><header class="w-full px-4 h-14 flex items-center gap-2 bg-[#FFF7FF]"><button aria-label="戻る" class="w-12 h-12 -ml-2 flex items-center justify-center rounded-full text-[#1D1B20] active:bg-[#F0E4F5] transition-colors" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[22px] font-semibold leading-[28px] text-[#1D1B20]">参加の確認</h1></header><main class="flex-1 flex flex-col justify-center px-6 pb-12 w-full max-w-md mx-auto"><div class="flex flex-col items-center w-full"><div class="w-[72px] h-[72px] rounded-full overflow-hidden bg-[#F2E7FE] flex items-center justify-center select-none shrink-0"><img alt="山田 花子" class="w-full h-full object-cover" data-alt="Friendly portrait photo of a cheerful Japanese woman named Hanako Yamada smiling warmly, soft daylight, tidy modern kitchen backdrop with pastel tones, subtle lavender ambient lighting, high quality mobile avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDU-waXYhhswkhBg5XSNy9Sfmm56Jgdpie9rXOfTf9VKA20z5WdpQvS2xE2PAMany4oaqvcVUSt-2pO9KbddQtAbQwdFxUte1nkyqE3ANjNInhK0rwrplBAk3_XsHpQsBd604gBYPFcOdFhZbheeRaFH7k69Wr6cU7Cxy-W1v4M4xXIBQ-Er0Tnt1qxNH2G_7d3DNn8CfydNIBdkZN43J7bSgwFcn3kGVMSh6D8u12tbdBLsqMXtmA-lw"/></div><h2 class="mt-6 text-[20px] font-bold leading-[28px] text-[#1D1B20] text-center">花子さんの家族に参加しますか？</h2><p class="mt-3 mb-8 text-[14px] font-normal leading-[20px] text-[#49454F] text-center">参加すると、家族の共有リストを一緒に使えるようになります。</p><div class="w-full flex flex-col gap-3"><button class="w-full h-[50px] rounded-full bg-[#6B4E8C] text-white font-bold text-[16px] leading-[24px] flex items-center justify-center active:opacity-90 select-none" id="btn-confirm-join" type="button">参加する</button><button class="w-full h-[50px] rounded-full bg-[#FFFFFF] border border-[#CAC4CF] text-[#49454F] font-bold text-[16px] leading-[24px] flex items-center justify-center active:bg-[#F6EAFB] select-none" id="btn-cancel-join" type="button">キャンセル</button></div></div><div class="hidden mt-6 bg-[#342E3A] text-[#F9EDFE] px-4 py-2.5 rounded-full items-center justify-center gap-2 mx-auto" id="feedback-toast"><span class="material-symbols-outlined text-[#DBB8FF] text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span><span class="text-[14px]" id="toast-text">参加しました</span></div></main><script>
  (function() {
    const confirmBtn = document.getElementById('btn-confirm-join');
    const cancelBtn = document.getElementById('btn-cancel-join');
    const toast = document.getElementById('feedback-toast');
    const toastText = document.getElementById('toast-text');

    if (confirmBtn && toast) {
      confirmBtn.addEventListener('click', function() {
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>処理中...</span>';
        
        setTimeout(function() {
          toastText.textContent = '花子さんの家族に参加しました！';
          toast.classList.remove('hidden');
          toast.classList.add('flex');
        }, 500);
      });
    }

    if (cancelBtn && toast) {
      cancelBtn.addEventListener('click', function() {
        toastText.textContent = '参加をキャンセルしました';
        toast.classList.remove('hidden');
        toast.classList.add('flex');
      });
    }
  })();
</script></body></html>
