<!DOCTYPE html>

<html class="h-full" lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Roboto+Mono:wght@700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#FFF7FF;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error": "#ffffff", "on-secondary-fixed-variant": "#563a74", "on-surface": "#1D1B20", "surface-container": "#f6eafb", "primary": "#6B4E8C", "surface-container-lowest": "#ffffff", "secondary": "#6e528d", "surface-container-low": "#fbf0ff", "primary-container": "#6b4e8c", "primary-fixed": "#efdbff", "on-tertiary": "#ffffff", "surface-container-high": "#f0e4f5", "tertiary-fixed": "#c3ebda", "tertiary-container": "#3e6255", "error": "#ba1a1a", "on-surface-variant": "#49454F", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#294e41", "surface-variant": "#eadfef", "inverse-primary": "#dbb8ff", "surface-bright": "#fff7ff", "on-primary-fixed-variant": "#563976", "on-primary": "#ffffff", "secondary-container": "#dbb9fd", "tertiary-fixed-dim": "#a7cfbf", "on-background": "#1D1B20", "inverse-on-surface": "#f9edfe", "surface-tint": "#6e518f", "on-primary-fixed": "#280a47", "surface": "#FFF7FF", "primary-fixed-dim": "#dbb8ff", "inverse-surface": "#342e3a", "on-secondary-container": "#624681", "background": "#FFF7FF", "on-primary-container": "#e4c9ff", "surface-container-highest": "#eadfef", "outline": "#7A757F", "surface-dim": "#e1d6e7", "on-error-container": "#93000a", "secondary-fixed-dim": "#dbb9fd", "on-tertiary-container": "#b4dccb", "on-secondary": "#ffffff", "outline-variant": "#ccc3d0", "on-secondary-fixed": "#280b45", "secondary-fixed": "#efdbff", "tertiary": "#264a3e", "on-tertiary-fixed": "#002117" }, fontFamily: { "sans": ["Plus Jakarta Sans", "sans-serif"], "mono": ["Roboto Mono", "monospace"] } } } };</script></head><body class="bg-[#FFF7FF] font-sans text-[#1D1B20] antialiased min-h-screen flex flex-col"><header class="fixed top-0 inset-x-0 z-50 bg-[#FFF7FF] pt-safe"><div class="h-14 px-4 flex items-center gap-2"><button aria-label="戻る" class="w-12 h-12 -ml-2 flex items-center justify-center text-[#1D1B20] active:opacity-70 transition-opacity" onclick="window.history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[22px] font-semibold text-[#1D1B20] tracking-tight select-none">招待コードで参加</h1></div></header><main class="flex-1 flex flex-col justify-between w-full bg-[#FFF7FF] px-4 pt-20 pb-safe"><div class="w-full max-w-md mx-auto pt-2"><label class="block text-[14px] font-medium text-[#49454F] mb-2 select-none" for="invite-code-input">招待コード（10文字）</label><div class="w-full relative"><input aria-label="招待コード（10文字）" autocapitalize="characters" autocomplete="off" class="w-full h-14 bg-[#FFFFFF] border border-[#7A757F] rounded-[12px] text-center font-mono text-[20px] font-bold text-[#1D1B20] placeholder:text-[#7A757F]/60 focus:outline-none focus:border-2 focus:border-[#6B4E8C] px-4 transition-all" id="invite-code-input" maxlength="12" spellcheck="false" type="text" value="7KQ2-M9XP-HA"/></div><p class="mt-[8px] text-[12px] font-normal leading-[18px] text-[#49454F]">家族から送られた招待コードを入力してください。大文字・小文字は問いません。</p></div><div class="w-full max-w-md mx-auto pb-4 pt-6"><button class="w-full h-[50px] min-h-[48px] rounded-full bg-[#6B4E8C] text-white font-bold text-[16px] flex items-center justify-center active:opacity-90 transition-opacity cursor-pointer" id="submit-code-btn" type="button">次へ</button></div><script>
  (function() {
    const input = document.getElementById('invite-code-input');
    const submitBtn = document.getElementById('submit-code-btn');

    function formatCode(val) {
      const clean = val.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
      let parts = [];
      if (clean.length > 0) parts.push(clean.substring(0, 4));
      if (clean.length > 4) parts.push(clean.substring(4, 8));
      if (clean.length > 8) parts.push(clean.substring(8, 10));
      return { formatted: parts.join('-'), rawLen: clean.length };
    }

    input.addEventListener('input', (e) => {
      const { formatted, rawLen } = formatCode(e.target.value);
      input.value = formatted;
      if (rawLen === 10) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        submitBtn.classList.add('cursor-pointer');
      } else {
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        submitBtn.classList.remove('cursor-pointer');
      }
    });

    submitBtn.addEventListener('click', () => {
      submitBtn.innerHTML = `<span>次へ</span><span class="material-symbols-outlined text-[20px] ml-1">check</span>`;
    });
  })();
</script></main></body></html>
