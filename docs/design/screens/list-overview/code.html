<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>CartMate</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app-bg': '#FFF7FF',
            'app-purple': '#6B4E8C',
            'app-purple-light': '#F2E7FE',
            'app-purple-track': '#F3EDF7',
            'app-border': '#CAC4CF',
            'app-text': '#1D1A22',
            'banner-bg': '#FBECE7',
            'banner-text': '#723821',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', 'Meiryo', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #FFF7FF;
      color: #1D1A22;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Enforce 1dp borders and clean corners per specification */
    .card-border {
      border: 1px solid #CAC4CF;
      box-shadow: none !important;
    }
    .card-border-dashed {
      border: 1.5px dashed #CAC4CF;
      box-shadow: none !important;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#f0eaf4]">
<!-- Mobile Screen Container -->
<div class="w-full max-w-[430px] min-h-screen bg-app-bg flex flex-col relative overflow-hidden pb-12 select-none shadow-xl">
<!-- BEGIN: StatusBar -->
<header class="w-full px-6 pt-3 pb-1 flex justify-between items-center text-sm font-semibold tracking-tight text-black" data-purpose="status-bar">
<span class="">09:41</span>
<div class="flex items-center space-x-1.5">
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.25c3.74 0 7.15 1.39 9.77 3.68L12 18.66 2.23 10.93C4.85 8.64 8.26 7.25 12 7.25z"></path>
</svg>
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-5h3v17h-3V4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-black rounded-[3px] p-[1px] flex items-center relative">
<div class="w-full h-full bg-black rounded-[1px]"></div>
<div class="absolute -right-[3px] top-[3px] w-[2px] h-[4px] bg-black rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopAppBar -->
<div class="w-full px-5 py-2 flex justify-between items-center" data-purpose="top-app-bar"><h1 class="text-[22px] font-semibold tracking-tight text-[#1D1B20]">CartMate</h1>
<button aria-label="ユーザーアカウント" class="w-12 h-12 flex items-center justify-center -mr-2 rounded-full focus:outline-none" data-purpose="user-avatar-button" type="button">
  <div class="w-8 h-8 rounded-full bg-[#F2E7FE] flex items-center justify-center text-[#260E43] font-medium text-sm">
    山
  </div>
</button></div>
<!-- END: TopAppBar -->
<!-- BEGIN: OfflineNoticeBanner -->

<!-- END: OfflineNoticeBanner -->
<!-- BEGIN: ContentArea -->
<main class="flex-1 px-4 pt-4 pb-24 overflow-y-auto" data-purpose="shopping-lists-overview">
<!-- Subheader with drag hint & total list counter tag -->
<div class="flex justify-between items-center mb-4 px-0.5"><p class="text-[14px] text-[#49454F] font-normal leading-normal">長押しで並び替えができます</p></div>
<!-- Grid of Cards (2 columns) -->
<div class="grid grid-cols-2 gap-3.5"><!-- 1. スーパー (共有・備考「週末の買い出し」・「5 件 のこり」・約35%) -->
<article class="bg-white rounded-[16px] p-4 flex flex-col justify-between card-border h-[184px]" data-purpose="list-card">
  <div>
    <div class="flex justify-between items-start">
      <h2 class="text-[18px] font-bold text-[#1D1B20] leading-tight">スーパー</h2>
      <div class="flex -space-x-1.5 items-center">
        <span class="w-5 h-5 rounded-full bg-[#E5DDF5] text-[#553E73] text-[10px] font-semibold flex items-center justify-center border border-white">T</span>
        <span class="w-5 h-5 rounded-full bg-[#D8C7F7] text-[#4E2B88] text-[10px] font-semibold flex items-center justify-center border border-white">Y</span>
      </div>
    </div>
    <p class="text-[14px] text-[#49454F] font-normal mt-1">週末の買い出し</p>
  </div>
  <div>
    <div class="flex items-baseline">
      <span class="text-[20px] font-bold text-[#6B4E8C] leading-none">5</span>
      <span class="text-[14px] text-[#1D1B20] font-normal ml-1">件 のこり</span>
    </div>
    <div class="w-full bg-[#F5EBF9] h-[6px] rounded-[3px] mt-2 overflow-hidden">
      <div class="bg-[#6B4E8C] h-full rounded-[3px]" style="width: 35%;"></div>
    </div>
  </div>
</article>

<!-- 2. 薬局 (プライベート・備考「日用品・常備薬」・「2 件 のこり」・約50%) -->
<article class="bg-white rounded-[16px] p-4 flex flex-col justify-between card-border h-[184px]" data-purpose="list-card">
  <div>
    <div class="flex justify-between items-start">
      <h2 class="text-[18px] font-bold text-[#1D1B20] leading-tight">薬局</h2>
      <svg class="w-4 h-4 text-[#49454F] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect height="11" rx="2" ry="2" width="14" x="5" y="10"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
    </div>
    <p class="text-[14px] text-[#49454F] font-normal mt-1">日用品・常備薬</p>
  </div>
  <div>
    <div class="flex items-baseline">
      <span class="text-[20px] font-bold text-[#6B4E8C] leading-none">2</span>
      <span class="text-[14px] text-[#1D1B20] font-normal ml-1">件 のこり</span>
    </div>
    <div class="w-full bg-[#F5EBF9] h-[6px] rounded-[3px] mt-2 overflow-hidden">
      <div class="bg-[#6B4E8C] h-full rounded-[3px]" style="width: 50%;"></div>
    </div>
  </div>
</article>

<!-- 3. ホームセンター (共有・備考「園芸・DIY資材」・「0 件 登録なし」・0%) -->
<article class="bg-white rounded-[16px] p-4 flex flex-col justify-between card-border h-[184px]" data-purpose="list-card">
  <div>
    <div class="flex justify-between items-start">
      <h2 class="text-[18px] font-bold text-[#1D1B20] leading-tight">ホームセンター</h2>
      <div class="flex items-center">
        <span class="w-5 h-5 rounded-full bg-[#E5DDF5] text-[#553E73] text-[10px] font-semibold flex items-center justify-center border border-white">T</span>
      </div>
    </div>
    <p class="text-[14px] text-[#49454F] font-normal mt-1">園芸・DIY資材</p>
  </div>
  <div>
    <div class="flex items-baseline text-[14px] text-[#49454F] font-normal">
      <span class="">0 件 登録なし</span>
    </div>
    <div class="w-full bg-[#F5EBF9] h-[6px] rounded-[3px] mt-2 overflow-hidden">
      <div class="bg-[#6B4E8C] h-full rounded-[3px]" style="width: 0%;"></div>
    </div>
  </div>
</article>

<!-- 4. イオン (共有・備考「火曜市まとめ買い」・「0 件 買い終わった！」・100%) -->
<article class="bg-white rounded-[16px] p-4 flex flex-col justify-between card-border h-[184px]" data-purpose="list-card">
  <div>
    <div class="flex justify-between items-start">
      <h2 class="text-[18px] font-bold text-[#1D1B20] leading-tight">イオン</h2>
      <div class="flex -space-x-1.5 items-center">
        <span class="w-5 h-5 rounded-full bg-[#E5DDF5] text-[#553E73] text-[10px] font-semibold flex items-center justify-center border border-white">T</span>
        <span class="w-5 h-5 rounded-full bg-[#D8C7F7] text-[#4E2B88] text-[10px] font-semibold flex items-center justify-center border border-white">M</span>
      </div>
    </div>
    <p class="text-[14px] text-[#49454F] font-normal mt-1">火曜市まとめ買い</p>
  </div>
  <div>
    <div class="flex items-baseline text-[14px] font-bold text-[#1D1B20]">
      <span class="">0 件 買い終わった！</span>
    </div>
    <div class="w-full bg-[#F5EBF9] h-[6px] rounded-[3px] mt-2 overflow-hidden">
      <div class="bg-[#6B4E8C] h-full rounded-[3px]" style="width: 100%;"></div>
    </div>
  </div>
</article>

<!-- 5. 100円ショップ (プライベート・備考「収納小物・消耗品」・「1 件 のこり」・約25%) -->
<article class="bg-white rounded-[16px] p-4 flex flex-col justify-between card-border h-[184px]" data-purpose="list-card">
  <div>
    <div class="flex justify-between items-start">
      <h2 class="text-[18px] font-bold text-[#1D1B20] leading-tight">100円ショップ</h2>
      <svg class="w-4 h-4 text-[#49454F] flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect height="11" rx="2" ry="2" width="14" x="5" y="10"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
    </div>
    <p class="text-[14px] text-[#49454F] font-normal mt-1">収納小物・消耗品</p>
  </div>
  <div>
    <div class="flex items-baseline">
      <span class="text-[20px] font-bold text-[#6B4E8C] leading-none">1</span>
      <span class="text-[14px] text-[#1D1B20] font-normal ml-1">件 のこり</span>
    </div>
    <div class="w-full bg-[#F5EBF9] h-[6px] rounded-[3px] mt-2 overflow-hidden">
      <div class="bg-[#6B4E8C] h-full rounded-[3px]" style="width: 25%;"></div>
    </div>
  </div>
</article></div>
</main>
<!-- END: ContentArea -->
<!-- BEGIN: FloatingActionButton -->
<div class="fixed bottom-7 right-6 z-20" data-purpose="fab-container"><button class="flex items-center space-x-1.5 bg-[#6B4E8C] text-white px-5 py-3 rounded-full font-bold active:scale-95 transition-all text-sm tracking-wide focus:outline-none" type="button">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
    <path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <span class="">リスト作成</span>
</button></div>
<!-- END: FloatingActionButton -->
<!-- BEGIN: HomeIndicator -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-gray-300 rounded-full" data-purpose="ios-home-indicator"></div>
<!-- END: HomeIndicator -->
</div>


</body></html>
