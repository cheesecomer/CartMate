<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>商品の詳細入力 - Lilac Material Grocery</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app-bg': '#FFF7FF',
            'app-primary': '#6B4E8C',
            'app-primary-dark': '#553C70',
            'app-primary-hover': '#5E437C',
            'app-banner': '#FBF0FF',
            'app-surface': '#FFFFFF',
            'app-border': '#CAC4CF',
            'app-text': '#1D1B20',
            'app-text-muted': '#49454F',
            'app-pill-bg': '#F7EEFB',
            'app-pill-border': '#E4D5EE',
            'app-merge-bg': '#F4E9FD',
            'app-merge-border': '#6B4E8C',
          },
          fontFamily: {
            sans: ['"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'Meiryo', 'sans-serif'],
          },
          borderRadius: {
            '2xl': '16px',
            'xl': '12px',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Form Elements & Elevation -->
<style data-purpose="custom-styling">
    body {
      background-color: #FFF7FF;
      color: #1D1B20;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbar for standard look */
    ::-webkit-scrollbar {
      display: none;
    }
    /* Native-like input styles */
    .material-input-box {
      border: 1px solid #79747E;
      transition: border-color 0.2s;
    }
    .material-input-box:focus-within {
      border-color: #6B4E8C;
      box-shadow: 0 0 0 1px #6B4E8C;
    }
  </style>
</head>
<body class="bg-app-bg min-h-screen flex justify-center text-app-text selection:bg-purple-200">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[430px] min-h-screen bg-app-bg flex flex-col relative pb-8 shadow-xl">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full px-7 pt-3 pb-2 flex justify-between items-center text-black text-[15px] font-semibold tracking-tight select-none">
<span class="">10:00</span>
<div class="flex items-center space-x-2">
<!-- Signal / Cellular Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.36 19.68 10.63 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.5-.47 2.89-1.28 4.03L6.97 5.28C8.36 4.47 10.12 4 12 4z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4zm0 3.66c3.4 0 6.54 1.3 8.9 3.44L12 19.98 3.1 11.1C5.46 8.96 8.6 7.66 12 7.66z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-6 h-3 border-2 border-black rounded-[4px] p-0.5 flex items-center">
<div class="w-full h-full bg-black rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1.5 bg-black rounded-r-sm ml-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopBar -->
<nav class="w-full px-4 py-2.5 flex items-center relative">
<button aria-label="閉じる" class="w-10 h-10 -ml-1 flex items-center justify-center text-app-text rounded-full hover:bg-black/5 active:bg-black/10 transition-colors" type="button">
<!-- Close '✕' Icon -->
<svg class="w-6 h-6 stroke-[2.2] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-[20px] font-bold tracking-tight text-app-text ml-2">商品の詳細入力</h1>
</nav>
<!-- END: TopBar -->
<!-- Scrollable Form Container -->
<main class="flex-1 px-4 pt-1 pb-24 space-y-3.5">
<!-- BEGIN: StoreBannerCard -->
<section class="w-full bg-app-banner rounded-2xl px-4 py-3 flex items-center space-x-2 text-[14px]" data-purpose="store-banner">
<!-- Store Icon -->
<span class="text-app-primary flex items-center justify-center">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M4 4h16a1 1 0 0 1 1 1v2.5a3.5 3.5 0 0 1-5 3.09 3.5 3.5 0 0 1-4 0 3.5 3.5 0 0 1-4 0 3.5 3.5 0 0 1-5-3.09V5a1 1 0 0 1 1-1zm0 7.35a3.49 3.49 0 0 0 3 0 3.49 3.49 0 0 0 3 0 3.49 3.49 0 0 0 3 0 3.49 3.49 0 0 0 3 0V20H4v-8.65zM6 14h4v4H6v-4z"></path>
</svg>
</span>
<span class="text-app-text font-medium">
          追加先: <span class="font-bold">スーパー</span> <span class="text-app-text-muted text-[13px] ml-1 font-normal">(共有リスト 2人)</span>
</span>
</section>
<!-- END: StoreBannerCard -->
<!-- BEGIN: ProductNameCard -->
<section class="w-full bg-app-surface border border-app-border rounded-2xl p-4 space-y-3.5" data-purpose="product-name-card">
<!-- Floating-like Outlined Textfield -->
<div class="relative">
<!-- Floating Label -->
<label class="absolute -top-2.5 left-3 bg-app-surface px-1.5 text-[12px] font-medium text-app-text-muted z-10" for="product-name-input">
            商品名
          </label>
<!-- Input field container -->
<div class="relative w-full rounded-lg border border-[#79747E] focus-within:border-app-primary focus-within:ring-1 focus-within:ring-app-primary transition-all">
<input class="w-full px-3.5 py-3 text-[17px] font-bold text-app-text bg-transparent border-0 rounded-lg focus:ring-0 focus:outline-none placeholder-gray-400" id="product-name-input" type="text" value="プレーンヨーグルト">
</div>
</div>
<!-- IMPROVED ASSOCIATION UI (SELECTED STATE) -->
<div aria-checked="true" class="w-full bg-[#FAF5FC] border border-app-border rounded-xl p-3 flex items-start space-x-3 cursor-pointer select-none transition-colors active:bg-[#F3E8F9]" data-purpose="association-merge-component" role="checkbox" tabindex="0"><div class="w-5 h-5 rounded-[4px] bg-app-primary text-white flex items-center justify-center shrink-0 mt-0.5 shadow-xs"><svg class="w-3.5 h-3.5 stroke-[3] stroke-current" fill="none" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><div class="flex flex-col space-y-0.5 flex-1 min-w-0"><span class="text-[14px] font-semibold text-app-text leading-snug">「ヨーグルト」と同じ商品として扱う</span><p class="text-[12px] font-normal text-app-text-muted leading-relaxed">購入履歴を合わせて、次の購入時期を予測します</p></div></div>
</section>
<!-- END: ProductNameCard -->
<!-- BEGIN: QuantityCard -->
<section class="w-full bg-app-surface border border-app-border rounded-2xl p-4 space-y-3.5" data-purpose="quantity-card">
<div class="flex justify-between items-center">
<h2 class="text-[16px] font-bold text-app-text">数量</h2>
<span class="text-[12px] text-app-text-muted">タップして直接編集可能</span>
</div>
<!-- Stepper Controller -->
<div class="w-full bg-[#FAF5FC] border border-[#EBE4F0] rounded-full p-1.5 flex items-center justify-between">
<!-- Minus Button -->
<button aria-label="減少" class="w-12 h-12 rounded-full bg-white border border-[#DDD6E3] flex items-center justify-center text-app-text shadow-sm hover:bg-gray-50 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.5] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Value Display with Editable Indicator -->
<div class="flex items-center space-x-1.5 cursor-pointer">
<span class="text-[26px] font-black tracking-tight text-app-text">1</span>
<span class="text-[14px] font-bold text-app-text-muted pt-1.5">個</span>
<!-- Pencil Edit Icon -->
<svg class="w-3.5 h-3.5 text-app-primary stroke-[2.5] stroke-current fill-none ml-0.5 pt-1" viewBox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Plus Button -->
<button aria-label="増加" class="w-12 h-12 rounded-full bg-app-primary flex items-center justify-center text-white shadow hover:bg-app-primary-hover active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.5] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Quick Select Pills (1-6) -->
<div class="flex justify-between items-center gap-1.5 pt-1">
<!-- Active Pill (1) -->
<button class="flex-1 py-2 rounded-full bg-app-primary text-white text-[15px] font-bold text-center shadow-xs" type="button">
            1
          </button>
<!-- Other Pills (2-6) -->
<button class="flex-1 py-2 rounded-full bg-app-pill-bg text-app-text text-[15px] font-medium text-center hover:bg-[#EFE2F6] transition-colors" type="button">
            2
          </button>
<button class="flex-1 py-2 rounded-full bg-app-pill-bg text-app-text text-[15px] font-medium text-center hover:bg-[#EFE2F6] transition-colors" type="button">
            3
          </button>
<button class="flex-1 py-2 rounded-full bg-app-pill-bg text-app-text text-[15px] font-medium text-center hover:bg-[#EFE2F6] transition-colors" type="button">
            4
          </button>
<button class="flex-1 py-2 rounded-full bg-app-pill-bg text-app-text text-[15px] font-medium text-center hover:bg-[#EFE2F6] transition-colors" type="button">
            5
          </button>
<button class="flex-1 py-2 rounded-full bg-app-pill-bg text-app-text text-[15px] font-medium text-center hover:bg-[#EFE2F6] transition-colors" type="button">
            6
          </button>
</div>
</section>
<!-- END: QuantityCard -->
<!-- BEGIN: UnitCard -->
<section class="w-full bg-app-surface border border-app-border rounded-2xl p-4 space-y-3.5" data-purpose="unit-card">
<h2 class="text-[16px] font-bold text-app-text">単位</h2>
<!-- Outlined Input with Value and Clear Button -->
<div class="relative w-full rounded-xl border border-[#79747E] focus-within:border-app-primary flex items-center px-4 py-2.5">
<input class="w-full text-[16px] font-medium text-app-text bg-transparent border-0 p-0 focus:ring-0 focus:outline-none" type="text" value="個">
<button aria-label="単位をクリア" class="text-app-text hover:text-black p-1 -mr-1" type="button">
<svg class="w-5 h-5 stroke-[2] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Quick Unit Pills -->
<div class="space-y-2">
<div class="flex items-center gap-2">
<!-- Active: 個 -->
<button class="min-w-[48px] px-3.5 py-1.5 rounded-full bg-app-primary text-white text-[14px] font-bold shadow-xs" type="button">
              個
            </button>
<!-- Inactive pills -->
<button class="px-4 py-1.5 rounded-full bg-app-pill-bg text-app-text text-[14px] font-medium border border-transparent hover:border-app-pill-border transition-all" type="button">
              本
            </button>
<button class="px-4 py-1.5 rounded-full bg-app-pill-bg text-app-text text-[14px] font-medium border border-transparent hover:border-app-pill-border transition-all" type="button">
              パック
            </button>
<button class="px-4 py-1.5 rounded-full bg-app-pill-bg text-app-text text-[14px] font-medium border border-transparent hover:border-app-pill-border transition-all" type="button">
              袋
            </button>
<button class="px-4 py-1.5 rounded-full bg-app-pill-bg text-app-text text-[14px] font-medium border border-transparent hover:border-app-pill-border transition-all" type="button">
              箱
            </button>
</div>
<!-- Second row for 'g' -->
<div class="flex items-center">
<button class="px-4 py-1.5 rounded-full bg-app-pill-bg text-app-text text-[14px] font-medium border border-transparent hover:border-app-pill-border transition-all" type="button">
              g
            </button>
</div>
</div>
</section>
<!-- END: UnitCard -->
<!-- BEGIN: VisibilityCard -->
<section class="w-full bg-app-surface border border-app-border rounded-2xl p-4 space-y-3" data-purpose="visibility-card">
<div>
<h2 class="text-[16px] font-bold text-app-text">公開範囲</h2>
<p class="text-[12px] text-app-text-muted mt-1">同居家族や共有メンバーに見せるかどうかを選択します。</p>
</div>
<!-- 2 Selection Cards -->
<div class="grid grid-cols-2 gap-2.5 pt-1">
<!-- Option 1: 全員に共有 (SELECTED) -->
<div aria-checked="true" class="rounded-xl border-2 border-app-primary bg-app-banner/40 p-3 flex flex-col justify-between cursor-pointer relative shadow-xs" role="radio">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-1.5">
<!-- Group / Users Icon -->
<svg class="w-5 h-5 text-app-primary fill-current" viewBox="0 0 24 24">
<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
</svg>
<span class="text-[14px] font-bold text-app-text">全員に共有</span>
</div>
<!-- Checkmark badge -->
<div class="w-4 h-4 rounded-full bg-app-primary text-white flex items-center justify-center">
<svg class="w-3 h-3 stroke-[3] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<span class="text-[11px] text-app-text-muted mt-2 block leading-snug">
              標準・リスト全員に表示
            </span>
</div>
<!-- Option 2: 自分のみ (UNSELECTED) -->
<div aria-checked="false" class="rounded-xl border border-app-border bg-app-pill-bg/50 p-3 flex flex-col justify-between cursor-pointer hover:bg-app-pill-bg transition-colors" role="radio">
<div class="flex items-center space-x-1.5">
<!-- Lock Icon -->
<svg class="w-4 h-4 text-app-text-muted fill-current" viewBox="0 0 24 24">
<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
</svg>
<span class="text-[14px] font-bold text-app-text">自分のみ</span>
</div>
<span class="text-[11px] text-app-text-muted mt-2 block leading-snug">
              サプライズや自分専用
            </span>
</div>
</div>
<!-- Footer Info Note -->
<div class="flex items-center space-x-1 pt-1 text-[12px] text-app-text-muted">
<!-- Info Circle Icon -->
<svg class="w-4 h-4 text-app-text-muted fill-current shrink-0" viewBox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"></path>
</svg>
<span class="">※ 登録後に公開範囲を変更することはできません</span>
</div>
</section>
<!-- END: VisibilityCard -->
<!-- BEGIN: NotesCard -->
<section class="w-full bg-app-surface border border-app-border rounded-2xl p-4 space-y-3" data-purpose="notes-card">
<div class="flex justify-between items-center">
<h2 class="text-[16px] font-bold text-app-text">備考・メモ</h2>
<span class="text-[12px] text-app-text-muted">任意</span>
</div>
<!-- Textarea Container -->
<div class="w-full rounded-xl border border-[#79747E] focus-within:border-app-primary p-3 min-h-[96px]">
<textarea class="w-full text-[14px] text-app-text placeholder-[#49454F] bg-transparent border-0 p-0 focus:ring-0 focus:outline-none resize-none leading-relaxed" placeholder="メモ（例: 特売品なら2個、賞味期限が長いものなど）" rows="3"></textarea>
</div>
</section>
<!-- END: NotesCard -->
</main>
<!-- BEGIN: BottomCTA -->
<div class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto px-4 pb-4 pt-2 bg-gradient-to-t from-app-bg via-app-bg to-transparent flex flex-col items-center">
<!-- Main Action Button -->
<button class="w-full h-[52px] bg-app-primary hover:bg-app-primary-hover active:scale-[0.99] text-white rounded-full font-bold text-[16px] flex items-center justify-center space-x-1.5 shadow-md transition-all" type="button">
<span class="">リストに追加する</span>
<svg class="w-5 h-5 stroke-[2.5] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-black/40 rounded-full mt-3"></div>
</div>
<!-- END: BottomCTA -->
</div>
<!-- END: MobileDeviceFrame -->


</body></html>
