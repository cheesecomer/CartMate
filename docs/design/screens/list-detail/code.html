<script>
    // タップによる即時フィードバック
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('#shopping-list > div');
      items.forEach((item) => {
        item.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          item.classList.add('scale-[0.98]');
          setTimeout(() => item.classList.remove('scale-[0.98]'), 100);
        });
      });
    });
  </script>
