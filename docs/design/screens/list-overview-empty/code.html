  </style></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen select-none"><!-- Android Native Status Bar --><header class="fixed top-0 w-full z-50 bg-[#fff7ff]"><div class="w-full h-8 px-6 flex items-center justify-between text-[#1d1b20] text-[14px] font-medium pt-1 select-none"><span>09:41</span><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[17px]">wifi</span><span class="material-symbols-outlined text-[17px]">signal_cellular_alt</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div><!-- Top App Bar: CartMate only, 22sp semi-bold, no back button, no action buttons --><div class="h-16 px-6 flex items-center"><h1 class="text-[22px] font-semibold text-[#1d1b20] tracking-tight leading-none">CartMate</h1></div></header><!-- Main Screen Content: Vertically Centered Empty State --><main class="flex-1 flex flex-col items-center justify-center px-6 pt-24 pb-12 w-full"><div class="flex flex-col items-center justify-center text-center max-w-sm w-full"><h2 class="text-[20px] font-bold text-[#1d1b20] leading-tight mb-2">リストがありません</h2><p class="text-[14px] font-normal text-[#49454f] leading-normal mb-8 text-center">最初の買い物リストを作成しましょう</p><button class="inline-flex items-center justify-center gap-2 min-h-[48px] px-8 rounded-full bg-[#6b4e8c] text-[#ffffff] font-medium text-[15px] shadow-sm hover:brightness-105 active:scale-95 transition-all" onclick="triggerFabAction()" type="button"><span class="material-symbols-outlined text-[20px]">add</span><span>リストを作成する</span></button></div><!-- Android Native Toast Container --><div class="fixed bottom-12 left-6 right-6 bg-[#342e3a] text-[#f9edfe] px-4 py-3 rounded-lg shadow-lg flex items-center justify-between opacity-0 pointer-events-none transition-opacity duration-300 z-40" id="quickToast"><span class="text-[14px] font-normal truncate" id="toastMsg">リストの作成画面を開きます</span></div><script>
  function triggerFabAction() {
    showToast('リストの作成画面を開きます');
  }

  function showToast(text) {
    const toast = document.getElementById('quickToast');
    const msg = document.getElementById('toastMsg');
    if (toast && msg) {
      msg.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  }
</script></main><!-- Android Navigation Bar Indicator --><footer class="fixed bottom-0 w-full z-50 pointer-events-none pb-safe"><div class="h-6 flex items-center justify-center"><div class="w-28 h-1 bg-[#1d1b20]/30 rounded-full"></div></div></footer></body></html>
