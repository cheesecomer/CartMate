eight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-secondary-container selection:text-on-secondary-container"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin py-space-md"><div class="flex flex-col w-full relative"><!-- Dimmed Family Background Screen -->
<div class="w-full flex flex-col gap-4 opacity-50 pointer-events-none select-none pb-8">
  <!-- TopAppBar -->
  <div class="flex items-center gap-3 py-2">
    <span class="material-symbols-outlined text-[#1D1B20] text-[24px]">arrow_back</span>
    <h1 class="text-[22px] font-semibold text-[#1D1B20] leading-tight">家族</h1>
  </div>

  <!-- 自分のアカウント Section -->
  <div class="flex flex-col gap-2 mt-2">
    <h2 class="text-[14px] font-medium text-[#49454F]">自分のアカウント</h2>
    <div class="bg-white rounded-[16px] border border-[#CAC4CF] p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-[#F2E7FE] flex items-center justify-center font-bold text-[#523673] text-[16px]">山</div>
      <div class="flex flex-col flex-1">
        <span class="text-[16px] font-bold text-[#1D1B20]">山田 太郎</span>
        <span class="text-[12px] font-normal text-[#49454F]">taro.yamada@gmail.com</span>
      </div>
    </div>
  </div>

  <!-- メンバー (3人) Section -->
  <div class="flex flex-col gap-2 mt-2">
    <h2 class="text-[14px] font-medium text-[#49454F]">メンバー (3人)</h2>
    <div class="bg-white rounded-[16px] border border-[#CAC4CF] divide-y divide-[#CAC4CF]/50 overflow-hidden">
      <!-- Row 1: 山田 太郎 -->
      <div class="p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-[#F2E7FE] flex items-center justify-center font-bold text-[#523673] text-[14px]">山</div>
          <div class="flex items-center gap-2">
            <span class="text-[14px] font-medium text-[#1D1B20]">山田 太郎</span>
            <span class="text-[12px] text-[#49454F]">(自分)</span>
          </div>
        </div>
        <span class="text-[12px] font-medium bg-[#efdbff] text-[#523673] px-2 py-0.5 rounded-full">オーナー</span>
      </div>
      <!-- Row 2: 山田 花子 -->
      <div class="p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-[#EADFEF] flex items-center justify-center font-bold text-[#6E528D] text-[14px]">花</div>
          <span class="text-[14px] font-medium text-[#1D1B20]">山田 花子</span>
        </div>
        <button class="text-[12px] font-medium text-[#B3261E] px-2 py-1" type="button">削除</button>
      </div>
      <!-- Row 3: 山田 健太 -->
      <div class="p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-[#EADFEF] flex items-center justify-center font-bold text-[#6E528D] text-[14px]">健</div>
          <span class="text-[14px] font-medium text-[#1D1B20]">山田 健太</span>
        </div>
        <button class="text-[12px] font-medium text-[#B3261E] px-2 py-1" type="button">削除</button>
      </div>
    </div>
  </div>

  <!-- 招待 Section -->
  <div class="flex flex-col gap-2 mt-2">
    <h2 class="text-[14px] font-medium text-[#49454F]">招待</h2>
    <div class="bg-white rounded-[16px] border border-[#CAC4CF] p-4 flex flex-col gap-3">
      <button class="w-full py-2.5 rounded-full bg-[#6B4E8C] text-white text-[14px] font-medium flex items-center justify-center gap-2" type="button">
        <span class="material-symbols-outlined text-[18px]">person_add</span>
        <span class="">家族を招待する</span>
      </button>
      <div class="border-t border-[#CAC4CF]/50 pt-3 flex flex-col gap-1">
        <div class="flex items-center justify-between">
          <span class="text-[12px] text-[#49454F]">有効な招待コード</span>
          <button class="text-[12px] font-medium text-[#B3261E]" type="button">取り消す</button>
        </div>
        <div class="flex items-baseline justify-between">
          <span class="text-[16px] font-bold text-[#1D1B20] tracking-wider">7KQ2-M9XP-HA</span>
          <span class="text-[11px] text-[#7C7580]">あと 23 時間で期限切れ</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Actions -->
  <div class="border-t border-[#CAC4CF]/50 pt-4 mt-2 flex flex-col gap-3">
    <button class="w-full text-left py-2 text-[14px] font-medium text-[#B3261E]" type="button">家族から抜ける</button>
    <button class="w-full text-left py-2 text-[14px] font-medium text-[#49454F]" type="button">ログアウト</button>
    <button class="w-full text-left py-2 text-[14px] font-medium text-[#B3261E]" type="button">アカウントを削除</button>
  </div>
</div>

<!-- Scrim Overlay and Dialog -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
  <div aria-labelledby="dialog-title" aria-modal="true" class="w-full max-w-[340px] bg-white rounded-[28px] border border-[#CAC4CF] p-6 flex flex-col relative" role="dialog">
    <h2 class="text-[20px] font-bold text-[#1D1B20] leading-tight" id="dialog-title">アカウントを削除しますか？</h2>
    <p class="text-[14px] font-normal text-[#49454F] leading-[20px] mt-4 mb-6">プライベートなリストと購入の記録を削除します。共有のリストは家族に残ります。この操作は取り消せません。削除の前に、Google で再度ログインします。</p>
    <div class="flex items-center justify-end gap-2">
      <button class="min-h-[48px] px-4 rounded-full flex items-center justify-center hover:bg-black/5 transition-colors text-[14px] font-medium text-[#49454F]" id="cancel-btn" type="button">キャンセル</button>
      <button class="min-h-[48px] px-4 rounded-full flex items-center justify-center hover:bg-[#B3261E]/10 transition-colors text-[14px] font-bold text-[#B3261E]" id="delete-btn" type="button">削除する</button>
    </div>
  </div>
</div></div>
<script>
  (() => {
    const cancelBtn = document.getElementById('cancel-btn');
    const deleteBtn = document.getElementById('delete-btn');

    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        const dialog = cancelBtn.closest('[role="dialog"]');
        if (dialog) {
          dialog.classList.add('scale-95', 'opacity-0');
          setTimeout(() => {
            const scrim = dialog.parentElement;
            if (scrim) scrim.style.display = 'none';
          }, 150);
        }
      });
    }

    if (deleteBtn) {
      deleteBtn.addEventListener('click', () => {
        const btnText = deleteBtn.querySelector('span');
        if (btnText) {
          btnText.textContent = '削除中...';
          deleteBtn.classList.add('opacity-70', 'pointer-events-none');
        }
      });
    }
  })();
</script></main>

</body></html>
