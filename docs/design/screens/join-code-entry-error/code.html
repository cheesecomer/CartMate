<!DOCTYPE html>

<html class="h-full" lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Roboto+Mono:wght@700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;background-color:#FFF7FF;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-error": "#ffffff", "on-surface": "#1D1B20", "primary": "#6B4E8C", "surface": "#FFF7FF", "error": "#B3261E" }, fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"], mono: ["Roboto Mono", "monospace"] } } } };</script></head><body class="bg-[#FFF7FF] font-sans text-[#1D1B20] antialiased min-h-screen flex flex-col"><header class="fixed top-0 inset-x-0 z-50 bg-[#FFF7FF] pt-safe"><div class="h-16 px-4 flex items-center gap-1"><button aria-label="戻る" class="w-12 h-12 -ml-2 flex items-center justify-center rounded-full text-[#1D1B20] active:bg-[#F6EAFB] transition-colors" onclick="window.history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="text-[22px] font-semibold text-[#1D1B20] tracking-tight leading-none select-none">招待コードで参加</h1></div></header><main class="flex-1 flex flex-col w-full bg-[#FFF7FF] px-4 pt-20 pb-safe justify-between"><div class="w-full flex flex-col pt-4">
<!-- Label -->
<label class="block text-[14px] font-medium text-[#49454F] mb-2" for="invite-code-field">招待コード（10文字）</label>
<!-- Input Field -->
<div class="w-full bg-[#FFFFFF] rounded-[12px] border-[2px] border-[#B3261E] px-4 py-3 flex items-center min-h-[56px]"><input aria-describedby="invite-error-msg" aria-invalid="true" autocapitalize="characters" autocomplete="off" class="w-full bg-transparent text-center font-mono text-[20px] font-bold text-[#1D1B20] outline-none tracking-wider" id="invite-code-field" spellcheck="false" type="text" value="7KQ2-M9XP-HA"/></div>
<!-- Error Text & Helper Message -->
<div class="mt-2" id="invite-error-msg" role="alert"><div class="flex items-center gap-1 text-[#B3261E]"><span class="material-symbols-outlined text-[16px] flex-shrink-0" style="font-variation-settings: 'FILL' 1;">error</span><p class="text-[12px] font-bold leading-none">招待コードが見つかりません</p></div><p class="text-[12px] font-normal text-[#49454F] leading-relaxed mt-[4px]">コードが正しいか確認するか、家族に新しいコードを発行してもらってください</p></div>
</div>
<!-- Primary Action Button -->
<div class="w-full pt-4 pb-6"><button class="w-full h-[50px] rounded-full bg-[#6B4E8C] text-white text-[16px] font-bold active:opacity-90 transition-opacity flex items-center justify-center" id="submit-code-btn" type="button">次へ</button></div>
</main></body></html>
