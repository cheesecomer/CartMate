<div class="flex flex-col items-center text-center pt-space-md">

<div class="w-[72px] h-[72px] rounded-full bg-secondary-fixed flex items-center justify-center text-on-primary-fixed select-none">
<span class="font-headline-lg text-headline-lg font-bold leading-none">花</span>
</div>

    </p>
<!-- アクションボタン群 -->
<div class="w-full flex flex-col gap-space-sm mt-space-xs">
