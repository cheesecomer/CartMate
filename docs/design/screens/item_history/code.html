<!-- Client-side Interactive Switch Handler -->
<script data-purpose="toggle-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const switches = document.querySelectorAll('[data-purpose="prediction-toggle"]');
      
      switches.forEach(toggle => {
        toggle.addEventListener('click', (e) => {
          e.preventDefault();
          const isChecked = toggle.getAttribute('aria-checked') === 'true';
          const nextState = !isChecked;
          
          toggle.setAttribute('aria-checked', String(nextState));
          const thumb = toggle.querySelector('span');
          
          if (nextState) {
            // Turned ON
            toggle.classList.remove('bg-brand-switchInactiveTrack', 'border', 'border-brand-outlineVariant');
            toggle.classList.add('bg-brand-primary');
            thumb.classList.remove('translate-x-0', 'bg-brand-switchInactiveThumb');
            thumb.classList.add('translate-x-5', 'bg-brand-onPrimary');
            thumb.innerHTML = `
              <svg class="w-3.5 h-3.5 text-brand-primary" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            `;
            toggle.setAttribute('aria-label', '周期予測に含める');
          } else {
            // Turned OFF
            toggle.classList.remove('bg-brand-primary');
            toggle.classList.add('bg-brand-switchInactiveTrack', 'border', 'border-brand-outlineVariant');
            thumb.classList.remove('translate-x-5', 'bg-brand-onPrimary');
            thumb.classList.add('translate-x-0', 'bg-brand-switchInactiveThumb');
            thumb.innerHTML = `
              <svg class="w-3 h-3 text-brand-surface" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            `;
            toggle.setAttribute('aria-label', '周期予測から除外されています');
          }
        });
      });
    });
  </script>
