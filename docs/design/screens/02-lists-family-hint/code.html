<!DOCTYPE html>

<html lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CartMate - 買い物リスト一覧</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lilac: {
              bg: '#FAF5FF',
              surface: '#FFFFFF',
              primary: '#6750A4',
              primaryDark: '#2E1F42',
              accent: '#7D5260',
              container: '#EADDFF',
              track: '#F3EDF7',
              textPrimary: '#1D1B20',
              textSecondary: '#49454F',
              muted: '#79747E'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', '"Hiragino Sans"', '"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      background-color: #FAF5FF;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style data-purpose="tooltip-decorations">
    /* Pointer tail for the Material Lilac tooltip */
    .tooltip-pointer {
      position: absolute;
      top: -7px;
      right: 18px;
      width: 14px;
      height: 14px;
      background-color: #2E1F42;
      transform: rotate(45deg);
      border-top-left-radius: 2px;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen flex justify-center items-start text-lilac-textPrimary antialiased selection:bg-purple-200">
<!-- Mobile Canvas Device Container -->
<div class="relative w-full max-w-[430px] min-h-screen flex flex-col justify-between overflow-x-hidden pb-8 px-5">
<!-- Top Section Container -->
<div class="w-full flex flex-col">
<!-- BEGIN: StatusBar -->
<section class="w-full pt-3 pb-1 flex justify-between items-center text-sm font-semibold tracking-tight text-gray-900 select-none" data-purpose="ios-status-bar">
<span class="text-[15px] font-medium tracking-tight">14:42</span>
<div class="flex items-center gap-1.5 text-xs">
<span class="font-bold text-[12px] tracking-tighter">5G</span>
<!-- Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="3" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-gray-900 rounded-[3px] p-[1px] flex items-center relative ml-0.5">
<div class="h-full bg-gray-900 rounded-[1.5px] w-full"></div>
<div class="absolute -right-1 top-0.8 w-0.5 h-1.5 bg-gray-900 rounded-r-sm"></div>
</div>
</div>
</section>
<!-- END: StatusBar -->
<!-- BEGIN: AppHeader -->
<header class="relative mt-4 flex items-center justify-between" data-purpose="header">
<!-- App Title -->
<h1 class="text-3xl font-extrabold tracking-tight text-gray-900">CartMate</h1>
<!-- User Avatar with Hint Target -->
<div class="relative">
<button aria-label="アカウント設定" class="w-11 h-11 rounded-full bg-[#E8DEF8] text-[#4A4458] flex items-center justify-center font-bold text-lg hover:opacity-90 active:scale-95 transition-transform" type="button">
            山
          </button>
</div>
</header>
<!-- END: AppHeader -->
<!-- BEGIN: MaterialLilacTooltip -->
<!-- Refined Hint Tooltip positioned harmoniously under the user avatar -->
<section class="relative w-full flex justify-end mt-2 z-20" data-purpose="tooltip-callout">
<div class="relative bg-[#2E1F42] text-white rounded-2xl p-3.5 shadow-lg max-w-[220px] animate-fade-in" id="family-account-hint">
<!-- Top pointer arrow directed to avatar -->
<div class="tooltip-pointer"></div>
<!-- Tooltip Message & Close -->
<div class="relative z-10 flex items-start justify-between gap-2">
<p class="text-[13px] leading-relaxed font-medium text-purple-100">
              家族とアカウントの設定は<br/>ここから
            </p>
<button aria-label="閉じる" class="text-purple-300 hover:text-white rounded-full p-0.5 -mt-0.5 -mr-1 transition-colors" onclick="document.getElementById('family-account-hint').style.display='none'" type="button">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" fill-rule="evenodd"></path>
</svg>
</button>
</div>
</div>
</section>
<!-- END: MaterialLilacTooltip -->
<!-- BEGIN: SubtitleText -->
<div class="mt-2.5 mb-4" data-purpose="guide-label">
<p class="text-[14px] text-gray-600 font-normal select-none">
          長押しで並び替えができます
        </p>
</div>
<!-- END: SubtitleText -->
<!-- BEGIN: GridCardsList -->
<main class="grid grid-cols-2 gap-3.5 mt-1" data-purpose="shopping-lists-grid">
<!-- Card 1: スーパー -->
<article class="bg-white rounded-[22px] border border-purple-100/80 p-4 min-h-[148px] flex flex-col justify-between shadow-[0_2px_8px_rgba(103,80,164,0.04)] active:scale-[0.98] transition-transform" data-purpose="list-card-supermarket">
<div>
<h2 class="text-[19px] font-bold text-gray-900 tracking-tight leading-snug">スーパー</h2>
<p class="text-xs text-gray-500 mt-1">週末のまとめ買い</p>
</div>
<div>
<p class="text-[13px] text-gray-700 font-medium mb-2.5">
<span class="text-xl font-bold text-[#5E3EA1]">4</span> <span class="text-gray-600 text-xs">件 のこり</span>
</p>
<!-- Progress Bar (Partial) -->
<div class="w-full bg-[#EDE7F6] h-1.5 rounded-full overflow-hidden">
<div class="bg-[#5E3EA1] h-full rounded-full w-[35%]"></div>
</div>
</div>
</article>
<!-- Card 2: 薬局 -->
<article class="bg-white rounded-[22px] border border-purple-100/80 p-4 min-h-[148px] flex flex-col justify-between shadow-[0_2px_8px_rgba(103,80,164,0.04)] active:scale-[0.98] transition-transform" data-purpose="list-card-pharmacy">
<div>
<h2 class="text-[19px] font-bold text-gray-900 tracking-tight leading-snug">薬局</h2>
</div>
<div>
<div class="flex items-center gap-1.5 mb-2.5">
<!-- Rounded Checkmark Badge -->
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#5E3EA1] text-white">
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-xs font-semibold text-[#5E3EA1]">買い終わった！</span>
</div>
<!-- Progress Bar (Completed) -->
<div class="w-full bg-[#EDE7F6] h-1.5 rounded-full overflow-hidden">
<div class="bg-[#5E3EA1] h-full rounded-full w-full"></div>
</div>
</div>
</article>
<!-- Card 3: ホームセンター -->
<article class="bg-white rounded-[22px] border border-purple-100/80 p-4 min-h-[148px] flex flex-col justify-between shadow-[0_2px_8px_rgba(103,80,164,0.04)] active:scale-[0.98] transition-transform" data-purpose="list-card-homecenter">
<div>
<h2 class="text-[19px] font-bold text-gray-900 tracking-tight leading-snug">ホームセンター</h2>
</div>
<div class="mt-auto">
<p class="text-[13px] text-gray-600 font-medium pb-1">
<span class="text-xl font-bold text-gray-800">0</span> <span class="text-gray-500 text-xs">件 登録なし</span>
</p>
</div>
</article>
<!-- Card 4: 誕生日の準備 (Lock) -->
<article class="bg-white rounded-[22px] border border-purple-100/80 p-4 min-h-[148px] flex flex-col justify-between shadow-[0_2px_8px_rgba(103,80,164,0.04)] active:scale-[0.98] transition-transform" data-purpose="list-card-birthday">
<div>
<div class="flex items-center gap-1.5">
<h2 class="text-[19px] font-bold text-gray-900 tracking-tight leading-snug">誕生日の準備</h2>
<!-- Lock Icon -->
<svg class="w-4 h-4 text-gray-600 mb-0.5 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" fill-rule="evenodd"></path>
</svg>
</div>
<p class="text-xs text-gray-500 mt-1">日曜のパーティー</p>
</div>
<div>
<p class="text-[13px] text-gray-700 font-medium mb-2.5">
<span class="text-xl font-bold text-[#5E3EA1]">3</span> <span class="text-gray-600 text-xs">件 のこり</span>
</p>
<!-- Progress Bar (Empty/Low) -->
<div class="w-full bg-[#EDE7F6] h-1.5 rounded-full overflow-hidden">
<div class="bg-[#5E3EA1] h-full rounded-full w-[12%]"></div>
</div>
</div>
</article>
</main>
<!-- END: GridCardsList -->
</div>
<!-- Bottom Section: Floating Action Button & Home Bar Indicator -->
<div class="w-full flex flex-col items-center mt-12">
<!-- BEGIN: FloatingActionButton -->
<aside class="w-full flex justify-end mb-4 pr-1" data-purpose="floating-action-container">
<button class="flex items-center gap-2.5 bg-[#5E3EA1] text-white px-6 py-3.5 rounded-full shadow-[0_4px_14px_rgba(94,62,161,0.35)] hover:bg-[#52348f] active:scale-95 transition-all text-[15px] font-semibold tracking-wide" type="button">
<!-- Plus Icon -->
<svg class="w-5 h-5 stroke-[2.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>リスト作成</span>
</button>
</aside>
<!-- END: FloatingActionButton -->
<!-- BEGIN: HomeIndicator -->
<footer class="w-full flex justify-center py-1" data-purpose="ios-home-indicator">
<div class="w-36 h-1 bg-gray-600 rounded-full opacity-60"></div>
</footer>
<!-- END: HomeIndicator -->
</div>
</div>
<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="event-handlers">
    // Optional click handler to toggle or close tooltip cleanly
    document.addEventListener('DOMContentLoaded', () => {
      const tooltip = document.getElementById('family-account-hint');
      if (tooltip) {
        tooltip.addEventListener('click', (e) => {
          if (e.target.tagName !== 'BUTTON') {
            tooltip.classList.add('transition-opacity', 'opacity-0');
            setTimeout(() => tooltip.style.display = 'none', 200);
          }
        });
      }
    });
  </script>
<!-- END: InteractiveHandlers -->
</body></html>
